<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Test Logo Galaxie BURGER M</title>


<style>


body{


margin:0;


height:100vh;


display:flex;


align-items:center;


justify-content:center;


background:#020202;


overflow:hidden;


font-family:Arial;


}






.logo-space{


position:relative;


width:500px;


height:500px;


display:flex;


align-items:center;


justify-content:center;


}







/* Nébulosité principale */


.logo-space::before{


content:"";


position:absolute;


width:900px;


height:900px;


left:50%;


top:50%;


transform:translate(-50%,-50%);



background:



radial-gradient(

circle,

rgba(255,240,160,.85),

rgba(255,210,80,.55) 15%,

rgba(255,160,30,.30) 35%,

rgba(255,120,0,.12) 55%,

transparent 72%

),



radial-gradient(

ellipse at 30% 40%,

rgba(255,220,120,.45),

transparent 45%

),



radial-gradient(

ellipse at 75% 60%,

rgba(255,170,40,.35),

transparent 45%

);





filter:blur(65px);


animation:pulse 8s infinite;


}





/* Lumière diffuse extérieure */


.logo-space::after{


content:"";


position:absolute;


width:1100px;


height:700px;


left:50%;


top:50%;


transform:translate(-50%,-50%);



background:


radial-gradient(

ellipse,

rgba(255,200,70,.35),

transparent 60%

);



filter:blur(100px);


}





.logo{


position:relative;


z-index:5;


width:260px;


height:260px;


object-fit:contain;



filter:



drop-shadow(

0 0 12px rgba(255,220,80,.8)

)



drop-shadow(

0 0 45px rgba(255,170,0,.55)

);



}






@keyframes pulse{


0%,100%{


transform:translate(-50%,-50%) scale(.95);


opacity:.75;


}



50%{


transform:translate(-50%,-50%) scale(1.08);


opacity:1;


}



}



</style>

</head>



<body>



<div class="logo-space">


<img src="logo.png" class="logo">


</div>



</body>

</html>
